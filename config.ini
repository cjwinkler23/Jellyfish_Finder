# ============================================================================================#
# DO NOT REMOVE KEY NAMES UNDER [DEFAULT]
# VALUES UNDER [DEFAULT] CAN BE MODIFIED, BUT THESE ARE RECCOMENDED VALUES
#
# TO USE A [DEFAULT] VALUE, COMMENT OUT THE CORRESPONDING LINE IN THE APPROPRIATE SECTION
# ============================================================================================#

[DEFAULT]

min_prod_level = 3
fallback_radius = 10
JWST_over_HST = True
max_overlap = 0.25
percent_conf = 0.6

	
[MODE]

#Make 	mode = obs_id		for csv in the format of cluster_name, obs_id
#Make	mode = name_coords	for csv in the format of cluster_name, RA, DEC, radius
#Make	mode = local		for local folder containing fits files

mode = 						    #Method of feeding data into the pipeline


[MODEL]
#REQUIRED

weights_file = 					#Name of file to use for weights. Specify absolute path if not located in /weights. Ex: best_weights.pth
percent_conf = 					#Only candidates with confidence > precent_conf will be saved (Default: 0.6 -> 60%)



[OBS_ID_MODE]
#Only required if mode is set to obs_id

csv_path = 					    #Path to CSV file. Ex: clusters.csv (either relative or absolute)



[NAME_COORDS_MODE]
#Only required if mode is set to name_cords

csv_path = 					    #Path to CSV file. Ex: clusters.csv (either relative or absolute)

filt_list = 					#Prioritized list of filters. Ex: F814W, F444W, ...
min_prod_level = 				#Minimum Data Product Level (Default: 3)
fallback_radius = 				#If no radius is given for a csv row, use this fallback value (arcmin). (Default: 10, Max: 30)
JWST_over_HST = 				#Prioritizes JWST observation over HST for the same pointing (Default: True)
max_overlap = 					#Maximum overlap between two pointings for the same cluster to be considered unique (Default: 0.25 -> 25%)




[LOCAL_MODE]
#Only required if mode is set to local

#Path to folder where fits files are stored. Ex: A3627/images
#If no path is given, it will default to looking in './local_fits/' 

data_dir = 					    
